{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-5">
                <h2 class="fw-bold mb-4">{{ title }}</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-4">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <div class="mt-5">
                        <button type="submit" class="btn btn-primary px-5 py-2">Save Marks</button>
                        <a href="{% url 'marks_list' %}" class="btn btn-outline-secondary px-5 py-2">Back to List</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
