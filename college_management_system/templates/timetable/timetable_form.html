{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card p-5 animate__animated animate__fadeIn">
                <h3 class="fw-bold text-dark mb-4"><i class="bi bi-calendar-event me-2"></i>{{ title }}</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-4">
                        <div class="col-md-12">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Subject</label>
                            {{ form.subject }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Day</label>
                            {{ form.day }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Room</label>
                            {{ form.room }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Start Time</label>
                            {{ form.start_time }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">End Time</label>
                            {{ form.end_time }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Faculty</label>
                            {{ form.faculty }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Department</label>
                            {{ form.department }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-50 small text-uppercase fw-bold">Semester</label>
                            {{ form.semester }}
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                        <a href="{% url 'timetable_list' %}" class="btn btn-outline-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">
                            <i class="bi bi-save me-2"></i> Save Entry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    select.form-control,
    input.form-control {
        background: rgba(255, 255, 255, 0.5) !important;
        border: 1px solid rgba(0, 0, 0, 0.1) !important;
        color: black !important;
        border-radius: 10px !important;
    }

    select.form-control option {
        background: #1a1a1a;
        color: white;
    }
</style>
{% endblock %}
