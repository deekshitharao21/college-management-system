{% extends 'base.html' %}

{% block title %}Delete Timetable Entry{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5 text-center animate__animated animate__bounceIn">
                <i class="bi bi-calendar-x text-danger display-1 mb-4"></i>
                <h3 class="fw-bold text-dark mb-3">Remove Entry?</h3>
                <p class="text-dark-50 mb-5">Are you sure you want to remove the <strong class="text-dark">{{
                        entry.subject }}</strong> class scheduled on <strong class="text-dark">{{ entry.get_day_display
                        }}</strong>?</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger rounded-pill py-3">
                            <i class="bi bi-trash-fill me-2"></i> Delete Entry
                        </button>
                        <a href="{% url 'timetable_list' %}" class="btn btn-outline-light rounded-pill py-3">
                            Keep Schedule
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
