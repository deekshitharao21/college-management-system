{% extends 'base.html' %}

{% block title %}Delete Notification{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5 text-center animate__animated animate__headShake">
                <i class="bi bi-exclamation-triangle text-danger display-1 mb-4"></i>
                <h3 class="fw-bold text-dark mb-3">Confirm Deletion</h3>
                <p class="text-dark-50 mb-5">Are you sure you want to delete this notification: <br><strong
                        class="text-dark">"{{ notification.title }}"</strong>? This action cannot be undone.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger rounded-pill py-3">
                            <i class="bi bi-trash me-2"></i> Delete Permanently
                        </button>
                        <a href="{% url 'notification_list' %}" class="btn btn-outline-light rounded-pill py-3">
                            Keep Notification
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
