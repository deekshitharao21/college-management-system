{% extends 'base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 mt-5">
            <div class="glass-card p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                </div>
                <h3 class="fw-bold mb-3">Delete Student?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ student.name }}</strong>? This
                    action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-danger py-2">Yes, Delete Student</button>
                        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
